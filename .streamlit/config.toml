# SKYZR theme. The accent is navy on purpose: red, yellow, green, purple and
# grey are reserved for county status, so nothing decorative may use them.
[theme]
base = "light"
primaryColor = "#1F4E79"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#E9EEF4"
textColor = "#1B2430"
borderColor = "#D3DAE3"
baseRadius = "small"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
